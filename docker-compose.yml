services:
  openhab:
    image: "openhab/openhab:5.1.4"
    container_name: openhab5
    restart: always
    network_mode: host
    volumes:
      - "/etc/localtime:/etc/localtime:ro"
      - "/etc/timezone:/etc/timezone:ro"
      - "./openhab_addons:/openhab/addons"
      - "./openhab_conf:/openhab/conf"
      - "./openhab_userdata:/openhab/userdata"
      - "./openhab-init.d:/etc/cont-init.d"
      - "./openhab-ssh:/openhab/.ssh"
      - "/opt/docker/rsyslog/data:/openhab/log"
    environment:
      CRYPTO_POLICY: "unlimited"
      EXTRA_JAVA_OPTS: "-Duser.timezone=Europe/Rome -Dorg.jupnp.network.useInterfaces=eth0 -Dorg.jupnp.network.useAddresses=172.27.72.11"
      OPENHAB_HTTP_PORT: "8080"
      OPENHAB_HTTPS_PORT: "8443"
